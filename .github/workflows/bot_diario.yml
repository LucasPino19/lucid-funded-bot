name: LucidFlex Bot Intraday

on:
  schedule:
    # Corre cada hora de 10:35am a 4:35pm ET (lunes a viernes)
    # ET = UTC-4 (EDT) — 10:35am ET = 14:35 UTC
    - cron: '35 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear carpetas necesarias
        run: |
          mkdir -p data
          mkdir -p reports

      - name: Correr bot
        run: python bot.py

      - name: Guardar estado y reporte en el repo
        run: |
          git config user.name  "LucidFlex Bot"
          git config user.email "bot@lucid"
          git add data/estado.json reports/
          git diff --staged --quiet || git commit -m "bot: run $(date +'%Y-%m-%d %H:%M UTC')"
          git push
