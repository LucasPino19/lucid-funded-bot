name: LucidFlex Bot Intraday

on:
  workflow_dispatch:
    # Disparado por cron-job.org via GitHub API (mas confiable que GitHub cron)
  schedule:
    # Respaldo: cada hora durante mercado (lun-vie, 14:37-22:37 UTC = 10:37-18:37 EDT)
    # Velas cierran a las :30 ET — :37 UTC da 7 min de margen para que Rithmic publique la barra.
    - cron: '37 14-22 * * 1-5'

concurrency:
  group: lucid-bot
  cancel-in-progress: false  # esperar a que termine — nunca cancelar un run activo

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear carpetas necesarias
        run: |
          mkdir -p data
          mkdir -p reports

      - name: Correr bot
        run: python bot.py
        env:
          LIVE_MODE:       'true'
          # Alinea EMA/ADX diaria a la sesion CME real (18:00 ET -> 17:00 ET)
          # en lugar de buckets calendario (00:00 ET -> 00:00 ET).
          # Backtest (200 evals, mar-may 2026): pass 99% -> 100%, mediana 33 -> 27 dias,
          # WR 47% -> 61%, PF 4.75 -> 7.42. Rollback: poner '0' o borrar la linea.
          GLOBEX_ALIGNED:  '1'
          # ── Variante C: entrada por STOP en el nivel (resuelve el slippage) ──
          # ORB_STOP_ENTRY='1' activa C. ORB_STOP_DRYRUN='1' = IMPRIME las órdenes
          # Rithmic SIN enviarlas (seguro, validar params en los logs vs MotiveWave).
          # Para operar REAL: cambiar ORB_STOP_DRYRUN a '0'.
          # Rollback total: poner ORB_STOP_ENTRY '0' → vuelve a la entrada market (B).
          ORB_STOP_ENTRY:  '1'
          ORB_STOP_DRYRUN: '0'
          RITHMIC_USER:    ${{ secrets.RITHMIC_USER }}
          RITHMIC_PASS:    ${{ secrets.RITHMIC_PASS }}

      - name: Guardar estado y reporte en el repo
        if: always()
        run: |
          git config user.name  "LucidFlex Bot"
          git config user.email "bot@lucid"
          git add data/estado.json reports/ || true
          git diff --staged --quiet || git commit -m "bot: run $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X ours origin main
          git push
