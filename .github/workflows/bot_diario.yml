name: LucidFlex Bot Intraday

on:
  workflow_dispatch:
    # Disparado por cron-job.org via GitHub API (mas confiable que GitHub cron)
  schedule:
    # Respaldo: cada hora durante mercado (lun-vie, 14:35-22:35 UTC cubre DST e invierno)
    - cron: '35 14-22 * * 1-5'

concurrency:
  group: lucid-bot
  cancel-in-progress: false  # esperar a que termine — nunca cancelar un run activo

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear carpetas necesarias
        run: |
          mkdir -p data
          mkdir -p reports

      - name: Correr bot
        run: python bot.py
        env:
          LIVE_MODE:     'true'
          RITHMIC_USER:  ${{ secrets.RITHMIC_USER }}
          RITHMIC_PASS:  ${{ secrets.RITHMIC_PASS }}

      - name: Guardar estado y reporte en el repo
        if: always()
        run: |
          git config user.name  "LucidFlex Bot"
          git config user.email "bot@lucid"
          git add data/estado.json reports/ || true
          git diff --staged --quiet || git commit -m "bot: run $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X ours origin main
          git push
